# zh/GLOSSARY.yaml —— 术语表（机器可读，CI 与 AI 共用）
#
# 字段：
#   en          英文原文（必填，匹配时大小写不敏感、按词边界）
#   zh          规范译法（必填，G1 检查"规范译法出现"的依据）
#   scope       适用范围（必填，固定 doc）
#   first_use   首次出现写法（可选，遵守 R6「中文（English）」）
#   forbid      禁用译法列表（可选，G1 在散文区命中即 FAIL）
#   ambiguity   一词多义的消歧规则（可选，列表；每项 mean/zh）
#   note        补充说明（可选）
#
# G1 只扫描散文区（代码块与 ASCII 图块除外）。

# ─── 核心概念 ────────────────────────────────────────────────────────────

- en: Context Engineering
  zh: 上下文工程
  first_use: 上下文工程（Context Engineering）
  forbid: [语境工程, 情景工程]
  scope: doc
  note: 全书标题级术语，不得译为「提示工程」

- en: context
  zh: 上下文
  forbid: [语境, 情景, 脉络, 上下文环境]
  scope: doc
  note: forbid 只约束把 context 本身译成上列词；scenario 的规范译法是「场景」，见 scenario 条。episodic memory 译「情景记忆」属固定术语，G1 先遮蔽规范译法，故不会被本条的 forbid 误伤

- en: scenario
  zh: 场景
  forbid: [情景]
  scope: doc
  note: 与 context 的 forbid 中的「情景」区隔：scenario 一律「场景」（情景规划→场景规划、情景构建→场景构建）。「情形」（situation）是通用词，不归本条管辖

- en: context management
  zh: 上下文管理
  scope: doc

- en: context processing
  zh: 上下文处理
  scope: doc

- en: context assembly
  zh: 上下文装配
  forbid: [上下文组装, 上下文拼装]
  scope: doc

- en: context engineering
  zh: 上下文工程
  scope: doc

- en: prompt
  zh: 提示词
  forbid: [提示语, 提示信息]
  scope: doc
  note: 作为独立名词一律「提示词」；"prompting" 译「提示」

- en: prompt engineering
  zh: 提示词工程
  forbid: [提示工程, 提示词设计工程]
  scope: doc

- en: prompt programming
  zh: 提示词编程
  forbid: [提示编程]
  scope: doc
  first_use: 提示词编程（prompt programming）

- en: token
  zh: 词元
  first_use: 词元（token）
  forbid: [令牌]
  scope: doc
  note: 度量单位处保留 token 亦可，但首现必须给中文

- en: token budget
  zh: 词元预算
  forbid: [令牌预算, token 预算]
  scope: doc

- en: embedding
  zh: 嵌入
  forbid: [向量嵌入]
  scope: doc
  note: 名词「embedding vector」译「嵌入向量」

- en: retrieval
  zh: 检索
  forbid: [召回]
  scope: doc

- en: Retrieval-Augmented Generation
  zh: 检索增强生成
  first_use: 检索增强生成（RAG）
  forbid: [检索增强式生成, 检索辅助生成]
  scope: doc

- en: RAG
  zh: RAG
  scope: doc
  note: 缩写保留不译

- en: chunk
  zh: 片段
  forbid: [分块, 切片]
  scope: doc
  note: 本仓库的「段」（chunk 注释里的 chunk）指翻译分段，不译「片段」；
        文档内容切分语境译「片段」

- en: reranking
  zh: 重排序
  forbid: [再排序]
  scope: doc

- en: vector store
  zh: 向量库
  forbid: [向量存储, 矢量库]
  scope: doc

- en: knowledge graph
  zh: 知识图谱
  scope: doc

- en: schema
  zh: 模式
  forbid: [结构体, 架构图]
  scope: doc
  note: JSON Schema 等专名保留 schema 不译

- en: template
  zh: 模板
  forbid: [范本, 样板]
  scope: doc

