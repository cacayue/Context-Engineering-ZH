# ─── 智能体与工具 ────────────────────────────────────────────────────────

- en: agent
  zh: 智能体
  forbid: [代理, 代理人, 经纪]
  scope: doc
  ambiguity:
    - mean: 智能体（通用角色）
      zh: 智能体
    - mean: .agent.md 提示词文件名
      zh: .agent.md（保留文件名不译）
  note: 文件名、目录名中的 agent 保留原文

- en: multi-agent
  zh: 多智能体
  forbid: [多代理, 多主体]
  scope: doc

- en: agentic
  zh: 智能体式的
  forbid: [代理式]
  scope: doc

- en: tool use
  zh: 工具使用
  scope: doc

- en: function calling
  zh: 函数调用
  scope: doc

- en: orchestration
  zh: 编排
  forbid: [协奏, 管弦]
  scope: doc
  note: forbid 只约束把 orchestration 本身译成「管弦/协奏」；音乐比喻词见 orchestra / concerto 两条

- en: orchestrator
  zh: 编排器
  scope: doc

- en: orchestra
  zh: 交响乐团
  forbid: [管弦乐队, 管弦乐团]
  scope: doc
  note: 音乐比喻（如「把编排想象成指挥交响乐团」）统一译「交响乐团」；不得译「管弦乐队」，以免与 orchestration 的 forbid 混淆

- en: concerto
  zh: 协奏曲
  scope: doc
  note: 协奏曲是合法音乐术语。G1 先遮蔽规范译法再查 forbid，因此「协奏曲」不会被 orchestration 的 forbid「协奏」误伤；正文不要用「交响曲」替代 concerto（那是 symphony）

- en: protocol
  zh: 协议
  scope: doc
  forbid: [协议规范]
  ambiguity:
    - mean: 协议壳规范（.shell.md 中的行为约定）
      zh: 协议
    - mean: 通信协议 / 网络协议
      zh: 协议
  note: 两者中文同形，按上下文补限定语（「协议壳」「通信协议」）区分

- en: shell
  zh: 协议壳
  scope: doc
  forbid: [外壳, 壳层]
  ambiguity:
    - mean: 协议壳（.shell.md 的可复用行为模板）
      zh: 协议壳
    - mean: bash / 命令行 shell
      zh: shell（保留）
  note: 命令、代码、CLI 语境保留 shell 原词

- en: schema field
  zh: 字段
  scope: doc

- en: resonance
  zh: 共振
  forbid: [共鸣, 谐振]
  scope: doc
  note: 物理与场论语境一律「共振」；音乐比喻（如「共鸣腔」「情感共鸣」）若确为 resounding/resonance 的隐喻义，可在正文保留「共鸣」并在报告中标注，或改写为「共振」以避免 G1 FAIL

- en: resonance scaffold
  zh: 共振支架
  forbid: [共振脚手架]
  scope: doc

